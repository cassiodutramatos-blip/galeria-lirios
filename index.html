<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Galáxia de Lírios 🪷</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #040212; 
            font-family: 'Poppins', sans-serif;
        }
        canvas { display: block; }

        /* Mensagem centralizada */
        .greeting {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
            z-index: 20;
            font-size: 2.2rem;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(0,0,0,0.6);
            background: linear-gradient(135deg, #FFFFFF, #FFB6C1, #E0BBE4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: fadeInDown 1.5s ease-out;
            padding: 0 20px;
        }
        .greeting small {
            font-size: 1rem;
            display: block;
            color: #F8E1E7;
            -webkit-background-clip: unset;
            background-clip: unset;
            margin-top: 8px;
            font-weight: 400;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 700px) {
            .greeting { font-size: 1.4rem; top: 30px; }
            .greeting small { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="greeting">
        🪷 Um buquê especial e uma galáxia de lírios para você 🌸
        <small>✨ Meu dia fica infinitamente melhor sempre que você está nele, enchendo o meu universo de lírios e cor. ✨</small>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- SETUP DA CENA & RENDERER ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x040212, 0.00045);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(13, 12, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.25;
        document.body.appendChild(renderer.domElement);

        // --- POST PROCESSING (BLOOM) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 0.9;
        bloomPass.radius = 0.6;

        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);

        // --- CONTROLES ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.4;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        // --- TEXTURA DA PARTÍCULA DE LÍRIO (CANVAS) ---
        function criarTexturaLirioParticula() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            ctx.beginPath(); ctx.arc(32, 32, 26, 0, Math.PI * 2);
            ctx.fillStyle = '#FFFFFF'; ctx.fill();

            ctx.beginPath(); ctx.arc(32, 32, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#FFB6C1'; ctx.fill();

            ctx.beginPath(); ctx.arc(32, 32, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#FFE57F'; ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        // --- PARTÍCULAS DA GALÁXIA ---
        const TOTAL_FLORES = 18500;
        const posicoes = new Float32Array(TOTAL_FLORES * 3);
        const cores = new Float32Array(TOTAL_FLORES * 3);
        const tamanhos = new Float32Array(TOTAL_FLORES);

        for (let i = 0; i < TOTAL_FLORES; i++) {
            let raio, angulo, yOffset;
            const ehNucleo = Math.random() < 0.2;

            if (ehNucleo) {
                raio = Math.pow(Math.random(), 1.3) * 4;
                angulo = Math.random() * Math.PI * 2;
                yOffset = (Math.random() - 0.5) * 2 * (1 - raio / 5);
            } else {
                const iBraco = Math.floor(Math.random() * 4);
                const t = Math.pow(Math.random(), 1.1);
                raio = 1.0 + t * 15;
                angulo = 2.6 * Math.log(raio + 0.6) + (iBraco / 4) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
                yOffset = Math.sin(raio * 1.4 + iBraco) * 0.7;
            }

            posicoes[i * 3] = Math.cos(angulo) * raio;
            posicoes[i * 3 + 1] = yOffset;
            posicoes[i * 3 + 2] = Math.sin(angulo) * raio;

            const mixColor = Math.random();
            if (mixColor < 0.45) {
                cores[i * 3] = 1.0; cores[i * 3 + 1] = 0.95; cores[i * 3 + 2] = 0.98;
            } else if (mixColor < 0.8) {
                cores[i * 3] = 1.0; cores[i * 3 + 1] = 0.65; cores[i * 3 + 2] = 0.78;
            } else {
                cores[i * 3] = 1.0; cores[i * 3 + 1] = 0.85; cores[i * 3 + 2] = 0.4;
            }

            tamanhos[i] = 0.3 + Math.random() * 0.5;
        }

        const geoParticulas = new THREE.BufferGeometry();
        geoParticulas.setAttribute('position', new THREE.BufferAttribute(posicoes, 3));
        geoParticulas.setAttribute('color', new THREE.BufferAttribute(cores, 3));
        geoParticulas.setAttribute('size', new THREE.BufferAttribute(tamanhos, 1));

        const matShader = new THREE.ShaderMaterial({
            uniforms: { uTex: { value: criarTexturaLirioParticula() } },
            vertexShader: `
                attribute float size; attribute vec3 color; varying vec3 vColor;
                void main() { vColor = color; vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * (300.0 / -mvPos.z); gl_Position = projectionMatrix * mvPos; }
            `,
            fragmentShader: `
                uniform sampler2D uTex; varying vec3 vColor;
                void main() { vec4 tColor = texture2D(uTex, gl_PointCoord);
                if (tColor.a < 0.3) discard; gl_FragColor = vec4(vColor * tColor.rgb, tColor.a); }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });

        scene.add(new THREE.Points(geoParticulas, matShader));

        // --- GEOMETRIA COMPARTILHADA DOS LÍRIOS ---
        const geoCaule = new THREE.CylinderGeometry(0.04, 0.04, 1.2, 8);
        const geoEstame = new THREE.CylinderGeometry(0.01, 0.01, 0.35, 6);
        const geoPetala = new THREE.ConeGeometry(0.12, 0.65, 8);
        geoPetala.scale(0.8, 1, 0.25);
        geoPetala.rotateX(Math.PI / 3);

        const matCaule = new THREE.MeshStandardMaterial({ color: 0x3d7033, roughness: 0.6 });
        const matEstame = new THREE.MeshStandardMaterial({ color: 0xffd15c, roughness: 0.3 });
        
        const matPetalaBranca = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, side: THREE.DoubleSide });
        const matPetalaRosa = new THREE.MeshStandardMaterial({ color: 0xff5c8a, roughness: 0.3, side: THREE.DoubleSide });
        const matPetalaAmarela = new THREE.MeshStandardMaterial({ color: 0xffeb3b, roughness: 0.3, side: THREE.DoubleSide });

        function criarLirio3D(x, y, z, escala = 1.0, corTipo = 'branco') {
            const grupo = new THREE.Group();

            const caule = new THREE.Mesh(geoCaule, matCaule);
            caule.position.y = -0.6;
            grupo.add(caule);

            for (let i = 0; i < 5; i++) {
                const ang = (i / 5) * Math.PI * 2;
                const estame = new THREE.Mesh(geoEstame, matEstame);
                estame.position.set(Math.cos(ang) * 0.04, 0.15, Math.sin(ang) * 0.04);
                grupo.add(estame);
            }

            let materialEscolhido = matPetalaBranca;
            if (corTipo === 'rosa') materialEscolhido = matPetalaRosa;
            if (corTipo === 'amarelo') materialEscolhido = matPetalaAmarela;

            for (let i = 0; i < 6; i++) {
                const angulo = (i / 6) * Math.PI * 2;
                const petala = new THREE.Mesh(geoPetala, materialEscolhido);
                const r = (i % 2 === 0) ? 0.22 : 0.28;
                petala.position.set(Math.cos(angulo) * r, 0.05, Math.sin(angulo) * r);
                petala.rotation.y = -angulo + Math.PI / 2;
                grupo.add(petala);
            }

            grupo.scale.setScalar(escala);
            grupo.position.set(x, y, z);
            return grupo;
        }

        // --- BUQUÊ CENTRAL ---
        const grupoBuque = new THREE.Group();
        const coresOpcoes = ['branco', 'rosa', 'amarelo'];
        
        for (let i = 0; i < 12; i++) {
            const ang = (i / 12) * Math.PI * 2;
            const r = Math.random() * 0.8;
            const cor = coresOpcoes[i % coresOpcoes.length];
            const florBuque = criarLirio3D(Math.cos(ang) * r, (Math.random() - 0.5) * 0.4, Math.sin(ang) * r, 0.9 + Math.random() * 0.2, cor);
            grupoBuque.add(florBuque);
        }
        scene.add(grupoBuque);

        // --- LÍRIOS SOLTOS PELA GALÁXIA ---
        const grupoLiriosSoltos = new THREE.Group();
        for (let i = 0; i < 25; i++) {
            const ang = Math.random() * Math.PI * 2;
            const r = 2.5 + Math.random() * 11;
            const cor = coresOpcoes[Math.floor(Math.random() * coresOpcoes.length)];
            const florSolta = criarLirio3D(Math.cos(ang) * r, (Math.random() - 0.5) * 1.5, Math.sin(ang) * r, 0.6 + Math.random() * 0.4, cor);
            grupoLiriosSoltos.add(florSolta);
        }
        scene.add(grupoLiriosSoltos);

        // --- ILUMINAÇÃO ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        
        const pLight = new THREE.PointLight(0xffb6c1, 2.5, 45);
        pLight.position.set(0, 4, 0);
        scene.add(pLight);

        // --- LOOP DE ANIMAÇÃO ---
        const clock = new THREE.Clock();

        function animar() {
            requestAnimationFrame(animar);
            const tempo = clock.getElapsedTime();

            grupoBuque.rotation.y = tempo * 0.1;

            grupoLiriosSoltos.children.forEach((g, i) => {
                g.rotation.z = Math.sin(tempo * 1.2 + i) * 0.06;
                g.rotation.x = Math.cos(tempo * 1.0 + i) * 0.06;
            });

            controls.update();
            effectComposer.render();
        }
        animar();

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            effectComposer.setSize(width, height);
        });
    </script>
</body>
</html>
