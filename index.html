<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Galáxia de Girassóis 🌻</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #020210; 
            font-family: 'Poppins', sans-serif;
        }
        canvas { display: block; }

        /* Mensagem centralizada */
        .greeting {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
            z-index: 20;
            font-size: 2.2rem;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(0,0,0,0.6);
            background: linear-gradient(135deg, #FFE55C, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: fadeInDown 1.5s ease-out;
        }
        .greeting small {
            font-size: 1rem;
            display: block;
            color: #FFDE7A;
            -webkit-background-clip: unset;
            background-clip: unset;
            margin-top: 8px;
            font-weight: 400;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 700px) {
            .greeting { font-size: 1.4rem; top: 30px; padding: 0 20px; }
            .greeting small { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="greeting">
        🌻 Para melhorar o seu dia sempre que você estiver triste 🌻
        <small>✨ Um buquê de estrelas para você ✨</small>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020210, 0.00045);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(13, 10, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 0.85; 
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.4;

        // --- GALÁXIA ---
        function criarTexturaFlorParticula() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.beginPath(); ctx.arc(32, 32, 28, 0, Math.PI * 2);
            ctx.fillStyle = '#FFE55C'; ctx.fill();
            ctx.beginPath(); ctx.arc(32, 32, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#633917'; ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }
        const texFlor = criarTexturaFlorParticula();

        const TOTAL_FLORES = 18500;
        const posicoes = new Float32Array(TOTAL_FLORES * 3);
        const cores = new Float32Array(TOTAL_FLORES * 3);
        const tamanhos = new Float32Array(TOTAL_FLORES);

        for (let i = 0; i < TOTAL_FLORES; i++) {
            let raio, angulo, yOffset;
            const ehNucleo = Math.random() < 0.2;
            if (ehNucleo) {
                raio = Math.pow(Math.random(), 1.3) * 4;
                angulo = Math.random() * Math.PI * 2;
                yOffset = (Math.random() - 0.5) * 2 * (1 - raio / 5);
            } else {
                const iBraco = Math.floor(Math.random() * 4);
                const t = Math.pow(Math.random(), 1.1);
                raio = 1.0 + t * 15;
                angulo = 2.6 * Math.log(raio + 0.6) + (iBraco / 4) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
                yOffset = Math.sin(raio * 1.4 + iBraco) * 0.7;
            }
            posicoes[i*3] = Math.cos(angulo) * raio;
            posicoes[i*3+1] = yOffset;
            posicoes[i*3+2] = Math.sin(angulo) * raio;
            cores[i*3] = 1.0; cores[i*3+1] = 0.7 + Math.random() * 0.3; cores[i*3+2] = 0.1;
            tamanhos[i] = 0.3 + Math.random() * 0.5;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(posicoes, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(cores, 3));
        geo.setAttribute('size', new THREE.BufferAttribute(tamanhos, 1));

        const matShader = new THREE.ShaderMaterial({
            uniforms: { uTex: { value: texFlor } },
            vertexShader: `
                attribute float size; attribute vec3 color; varying vec3 vColor;
                void main() { vColor = color; vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * (300.0 / -mvPos.z); gl_Position = projectionMatrix * mvPos; }
            `,
            fragmentShader: `
                uniform sampler2D uTex; varying vec3 vColor;
                void main() { vec4 tColor = texture2D(uTex, gl_PointCoord);
                if (tColor.a < 0.3) discard; gl_FragColor = vec4(vColor * tColor.rgb, tColor.a); }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        scene.add(new THREE.Points(geo, matShader));

        // --- GIRASSÓIS 3D ---
        function criarGirassol3D(x, z, escala = 1.0) {
            const grupo = new THREE.Group();
            const caule = new THREE.Mesh(new THREE.CylinderGeometry(0.08*escala, 0.08*escala, 1*escala), new THREE.MeshStandardMaterial({color: 0x5a9e4e}));
            caule.position.y = -0.5*escala; grupo.add(caule);
            const miolo = new THREE.Mesh(new THREE.SphereGeometry(0.2*escala, 16, 16), new THREE.MeshStandardMaterial({color: 0x633917}));
            grupo.add(miolo);
            const petalaMat = new THREE.MeshStandardMaterial({color: 0xffcc44});
            for(let i=0; i<10; i++) {
                const ang = (i/10)*Math.PI*2;
                const p = new THREE.Mesh(new THREE.CylinderGeometry(0.15*escala, 0.15*escala, 0.35*escala), petalaMat);
                p.position.set(Math.cos(ang)*0.3*escala, 0, Math.sin(ang)*0.3*escala);
                p.rotation.z = ang; grupo.add(p);
            }
            grupo.position.set(x, (Math.random()-0.5)*1.5, z);
            return grupo;
        }

        const grupoGirassois = new THREE.Group();
        for(let i=0; i<25; i++) {
            const ang = Math.random()*Math.PI*2;
            const r = 2 + Math.random()*10;
            grupoGirassois.add(criarGirassol3D(Math.cos(ang)*r, Math.sin(ang)*r, 0.7 + Math.random()*0.3));
        }
        scene.add(grupoGirassois);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const pLight = new THREE.PointLight(0xffaa55, 2, 50);
        pLight.position.set(0, 5, 0);
        scene.add(pLight);

        // --- ANIMAÇÃO E MOUSE ---
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;
        });

        function animar() {
            requestAnimationFrame(animar);
            const tempo = Date.now() * 0.001;
            camera.position.x += (mouseX * 5 - camera.position.x) * 0.02;
            camera.position.y += (-(mouseY * 5) + 10 - camera.position.y) * 0.02;
            grupoGirassois.children.forEach((g, i) => {
                g.rotation.z = Math.sin(tempo + i) * 0.1;
            });
            controls.update();
            effectComposer.render();
        }
        animar();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
